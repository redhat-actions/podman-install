name: "Install Podman"
description: "Installs Podman on Linux, or a specific/latest version on Windows."

inputs:
  ubuntu-version:
    description: "The Ubuntu version codename for the Kubic repository."
    required: false
    default: "23.10"
  ubuntu-repository:
    description: "The Ubuntu distro source to use for podman, ie: questing, resolute, noble. Or use openSUSE's kubic repo"
    required: false
    default: questing
  allow-upgrade:
    description: "Allow upgrade of the Ubuntu system, defaults to false"
    required: false
    default: 'false'
  podman-version-input:
    description: "Podman version for Windows. Use 'latest' or a specific version (e.g. '5.6.2')."
    required: false
    default: "latest"
  install-scope:
    description: "Installation scope for Windows MSI installer. Use 'user' for user-scope (no admin required) or 'machine' for machine-scope (requires admin privileges)."
    required: false
    default: "user"
  start-service:
    description: "Start the Podman socket service after installation (Linux only). Runs 'systemctl --user start podman.socket'."
    required: false
    default: 'false'
  github-token:
    description: "GitHub token to make authenticated API requests and avoid rate limiting."
    required: false

runs:
  using: "composite"
  steps:
    - name: Update podman to 5.x on Linux from Kubic repository
      if: ${{ runner.os == 'Linux' && inputs.ubuntu-repository == 'kubic' }}
      shell: bash
      run: |
        set -euo pipefail
        ubuntu_version='${{ inputs.ubuntu-version }}'
        echo "INFO: Using Ubuntu version '${ubuntu_version}' for Kubic repository."

        echo "INFO: Adding Kubic repository..."
        sudo sh -c "echo 'deb https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${ubuntu_version}/ /' > /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list"
        curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${ubuntu_version}/Release.key" | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kubic.gpg

        echo "INFO: Updating package list..."
        sudo apt-get update -qq

        echo "INFO: Installing CRIU dependencies..."
        sudo apt-get install --allow-unauthenticated -qq -y libprotobuf32t64 python3-protobuf libnet1

        echo "INFO: Installing CRIU manually..."
        ARCH=$(dpkg --print-architecture)
        curl -sLO "http://archive.ubuntu.com/ubuntu/pool/universe/c/criu/criu_3.16.1-2_${ARCH}.deb" && sudo dpkg -i "criu_3.16.1-2_${ARCH}.deb"

        echo "INFO: Installing Podman..."
        sudo apt-get -qq -y install --allow-unauthenticated podman || {
          echo "WARN: Primary installation failed. Trying fallback repository..."
          sudo sh -c "echo 'deb http://ftp.lysator.liu.se/pub/opensuse/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${ubuntu_version}/ /' > /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list"
          curl -fsSL "http://ftp.lysator.liu.se/pub/opensuse/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_${ubuntu_version}/Release.key" | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/kubic-fallback.gpg
          sudo apt-get --allow-insecure-repositories update -qq
          sudo apt-get --allow-unauthenticated -y install podman
        }

        echo "INFO: Podman installation complete."
        podman version

    - name: Update podman to 5.x on Linux from ${{ inputs.ubuntu-repository }} repository
      if: ${{ runner.os == 'Linux' && inputs.ubuntu-repository != 'kubic' }}
      shell: bash
      run: |
        set -eux
        ubuntu_repo="${{ inputs.ubuntu-repository }}"
        allow_upgrade="${{ inputs.allow-upgrade }}"
        echo "INFO: Using ${ubuntu_repo} Ubuntu repository for podman installation."
        echo "INFO: The system upgrade is allowed: ${allow_upgrade}"
        # Require the runner is ubuntu-24.04
        IDV=$(. /usr/lib/os-release && echo ${ID}-${VERSION_ID})
        echo "Actual Ubuntu version: ${IDV}"
        echo "deb http://azure.archive.ubuntu.com/ubuntu ${ubuntu_repo} universe main" | sudo tee /etc/apt/sources.list.d/${ubuntu_repo}.list
        /bin/time -f '%E %C' sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/${ubuntu_repo}.list" \
          -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
        # Disable auto upgrade for this repository by default
        if [ "${allow_upgrade}" == "false" ]; then
          sudo tee /etc/apt/preferences.d/${ubuntu_repo} <<EOF
        Package: *
        Pin: release n=${ubuntu_repo}
        Pin-Priority: 50
        
        Package: podman criu crun skopeo buildah
        Pin: release n=${ubuntu_repo}
        Pin-Priority: 500
        EOF
        fi
        /bin/time -f '%E %C' sudo apt install -y --allow-downgrades criu/${ubuntu_repo} crun/${ubuntu_repo} podman/${ubuntu_repo} skopeo/${ubuntu_repo}
        AFTER_IDV=$(. /usr/lib/os-release && echo ${ID}-${VERSION_ID})
        if [[ "$AFTER_IDV" != "$IDV" ]]; then
          echo "### WARNING Ubuntu was upgraded from $IDV to $AFTER_IDV"
        fi
        echo "Actual ubuntu version: ${AFTER_IDV}"
        echo "Actual podman installed: $(podman -v)"

    - name: Start Podman socket service
      if: ${{ runner.os == 'Linux' && inputs.start-service == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "INFO: Starting Podman socket service..."
        systemctl --user start podman.socket
        echo "INFO: Podman socket service started."
        systemctl --user status podman.socket --no-pager

    - name: Fetch Podman Download URL for Windows
      if: runner.os == 'Windows'
      id: fetch-podman-url
      uses: redhat-actions/podman-install/.github/actions/fetch-latest-podman-version-windows@6b9121eed76855854291b52c6bfbc278dbdf0288
      with:
        version_input: ${{ inputs.podman-version-input || 'latest' }}
        github_token: ${{ inputs.github-token }}

    - name: Install Podman on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $downloadUrl = "${{ steps.fetch-podman-url.outputs.download_url }}"
        $podmanVersion = "${{ steps.fetch-podman-url.outputs.version }}"
        $installScope = "${{ inputs.install-scope }}"

        $uri = [System.Uri]$downloadUrl
        $fileName = Split-Path -Leaf $uri.AbsolutePath

        echo "Installing Podman version $podmanVersion..."
        echo "Installation scope: $installScope"
        echo "Downloading from $downloadUrl to $fileName"
        curl --output $fileName -L $downloadUrl

        if ($fileName -match '\.msi$') {
          $msiArgs = @("/package", "$PWD\$fileName", "/quiet", "/norestart", "/l*v", "podman-msi.log")
          if ($installScope -eq "machine") {
            echo "Installing at machine-scope (requires admin privileges)..."
            $msiArgs += "ALLUSERS=1"
          } else {
            echo "Installing at user-scope (no admin required)..."
          }
          Start-Process msiexec -ArgumentList $msiArgs -Wait
        } else {
          Start-Process -FilePath ".\$fileName" -ArgumentList "/install", "/passive", "/norestart", "/log podman-logs.txt" -Wait
        }
        if ($fileName -match '\.msi$' -and (Test-Path podman-msi.log)) {
          Get-Content podman-msi.log
        } elseif (Test-Path podman-logs.txt) {
          Get-Content podman-logs.txt
        }

    - name: Initialize Podman Machine on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installScope = "${{ inputs.install-scope }}"
        
        echo "Adding Podman to PATH..."
        # New MSI installer locations (user-scope and machine-scope)
        $userScopePath = "$env:LOCALAPPDATA\Programs\Podman"
        $machineScopePath = "$env:ProgramFiles\Podman"
        # Legacy installer location (for backward compatibility)
        $legacyPath = "$env:ProgramFiles\RedHat\Podman"

        $podmanDir = $null
        # Check based on install scope first, then fall back to other locations
        if ($installScope -eq "machine" -and (Test-Path $machineScopePath)) {
          $podmanDir = $machineScopePath
        } elseif ($installScope -eq "user" -and (Test-Path $userScopePath)) {
          $podmanDir = $userScopePath
        } elseif (Test-Path $userScopePath) {
          $podmanDir = $userScopePath
        } elseif (Test-Path $machineScopePath) {
          $podmanDir = $machineScopePath
        } elseif (Test-Path $legacyPath) {
          $podmanDir = $legacyPath
        }

        if ($podmanDir) {
          # Add to current step's PATH
          $env:PATH += ";$podmanDir"
          # Persist for subsequent steps in the consuming workflow
          echo $podmanDir >> $env:GITHUB_PATH
        }
        
        $podmanPath = (Get-Command podman).Path
        echo "Podman installed at: $podmanPath"
        
        podman --version
        echo "Initializing Podman machine..."
        podman machine init --now
